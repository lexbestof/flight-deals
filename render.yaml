services:
  - type: web
    name: kinshasa-flight-deals-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: cron
    name: kinshasa-flight-deals-telegram
    runtime: python
    rootDir: backend
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python watcher.py
    envVars:
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
